name: 商业部署发布

on:
  push:
    branches:
      - "release/**"
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      version:
        description: "发布版本号，不带 v；留空时生成开发快照版本。"
        required: false
        type: string
      publish_public_repo:
        description: "是否将渲染后的商业部署包发布到 SagittaDB-Enterprise 公开仓库。正式 tag 始终发布。"
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  packages: write
  id-token: write

env:
  PRODUCT_CODE: sagittadb
  PRODUCT_NAME: SagittaDB Enterprise
  COMMERCIAL_BASE_VERSION: "2.2.0"
  PUBLIC_RELEASE_REPOSITORY: Lynn-Lee/SagittaDB-Enterprise
  PUBLIC_IMAGE_REPOSITORY: ghcr.io/lynn-lee/sagittadb

concurrency:
  group: commercial-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    name: 构建并发布商业部署包
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 解析发布元数据
        id: release
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            version="${GITHUB_REF_NAME#v}"
            channel="stable"
          elif [[ -n "${{ inputs.version || '' }}" ]]; then
            version="${{ inputs.version }}"
            channel="stable"
          elif [[ "${GITHUB_REF_NAME}" == release/* ]]; then
            short_sha="$(git rev-parse --short=7 HEAD)"
            base_version="${GITHUB_REF_NAME#release/}"
            base_version="${base_version//\//-}"
            version="${base_version}-rc.${GITHUB_RUN_NUMBER}.${short_sha}"
            channel="rc"
          else
            short_sha="$(git rev-parse --short=7 HEAD)"
            version="${COMMERCIAL_BASE_VERSION}-dev.${GITHUB_RUN_NUMBER}.${short_sha}"
            channel="snapshot"
          fi
          package_name="SagittaDB-Enterprise-v${version}"
          echo "version=${version}" >> "${GITHUB_OUTPUT}"
          echo "channel=${channel}" >> "${GITHUB_OUTPUT}"
          echo "package_name=${package_name}" >> "${GITHUB_OUTPUT}"
          echo "release_dir=v${version}" >> "${GITHUB_OUTPUT}"

      - name: 登录 GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 设置 Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 校验商业构建上下文
        shell: bash
        run: scripts/validate-commercial-build-context.sh

      - name: 构建并推送商业后端镜像
        id: backend-image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: backend/Dockerfile.commercial
          push: true
          secrets: |
            manifest_private_key=${{ secrets.MANIFEST_PRIVATE_KEY }}
          build-args: |
            SAGITTADB_VERSION=${{ steps.release.outputs.version }}
          tags: |
            ${{ env.PUBLIC_IMAGE_REPOSITORY }}-backend:${{ steps.release.outputs.version }}
          labels: |
            org.opencontainers.image.title=SagittaDB Backend
            org.opencontainers.image.version=${{ steps.release.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: 构建并推送商业前端镜像
        id: frontend-image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: true
          tags: |
            ${{ env.PUBLIC_IMAGE_REPOSITORY }}-frontend:${{ steps.release.outputs.version }}
          labels: |
            org.opencontainers.image.title=SagittaDB Frontend
            org.opencontainers.image.version=${{ steps.release.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: 安装 Cosign
        uses: sigstore/cosign-installer@v3

      - name: 安装 Syft
        uses: anchore/sbom-action/download-syft@v0

      - name: 校验商业镜像内容
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${{ steps.release.outputs.version }}" \
          IMAGE_REPOSITORY="${PUBLIC_IMAGE_REPOSITORY}" \
          scripts/validate-commercial-images.sh

      - name: 生成镜像 SBOM
        shell: bash
        env:
          COSIGN_EXPERIMENTAL: "true"
        run: |
          set -euo pipefail
          VERSION="${{ steps.release.outputs.version }}" \
          IMAGE_REPOSITORY="${PUBLIC_IMAGE_REPOSITORY}" \
          SBOM_OUTPUT_DIR="dist-commercial/sbom" \
          scripts/generate-commercial-sbom.sh

      - name: 渲染客户部署包
        shell: bash
        run: |
          set -euo pipefail
          version="${{ steps.release.outputs.version }}"
          package_name="${{ steps.release.outputs.package_name }}"

          python scripts/render-customer-package.py \
            --version "${version}" \
            --image-repository "${PUBLIC_IMAGE_REPOSITORY}" \
            --output-dir dist-commercial \
            --package-name "${package_name}"

          (
            cd dist-commercial
            sha256sum --check "${package_name}.zip.sha256"
          )

      - name: 签名商业发布产物
        shell: bash
        env:
          COSIGN_EXPERIMENTAL: "true"
          MANIFEST_PRIVATE_KEY: ${{ secrets.MANIFEST_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          VERSION="${{ steps.release.outputs.version }}" \
          IMAGE_REPOSITORY="${PUBLIC_IMAGE_REPOSITORY}" \
          PACKAGE_ZIP="dist-commercial/${{ steps.release.outputs.package_name }}.zip" \
          SBOM_DIR="dist-commercial/sbom" \
          scripts/sign-commercial-artifacts.sh

      - name: 校验商业发布材料
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${{ steps.release.outputs.version }}" \
          PACKAGE_NAME="${{ steps.release.outputs.package_name }}" \
          DIST_DIR="dist-commercial" \
          SBOM_DIR="dist-commercial/sbom" \
          scripts/validate-commercial-release-materials.sh

      - name: 上传商业部署包
        if: ${{ vars.ENABLE_COMMERCIAL_RELEASE_ARTIFACT == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: sagittadb-commercial-deployment
          path: |
            dist-commercial/*.zip
            dist-commercial/*.zip.sha256
            dist-commercial/*.zip.sig.json
            dist-commercial/sbom/*
          if-no-files-found: error

      - name: 检出公开发布仓库
        if: ${{ startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.publish_public_repo) }}
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.PUBLIC_RELEASES_TOKEN }}
        run: |
          set -euo pipefail

          git init public-releases
          cd public-releases
          git remote add origin "https://github.com/${PUBLIC_RELEASE_REPOSITORY}.git"
          auth_header="$(printf 'x-access-token:%s' "${GH_TOKEN}" | base64 | tr -d '\n')"
          git config --local http.https://github.com/.extraheader "AUTHORIZATION: basic ${auth_header}"

          if git ls-remote --exit-code --heads origin main >/dev/null 2>&1; then
            git fetch --depth=1 origin main
            git checkout -B main FETCH_HEAD
          else
            git checkout -B main
          fi

      - name: 发布部署包到 SagittaDB-Enterprise
        if: ${{ startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.publish_public_repo) }}
        shell: bash
        run: |
          set -euo pipefail

          package_name="${{ steps.release.outputs.package_name }}"
          release_dir="${{ steps.release.outputs.release_dir }}"
          public_dir="public-releases"

          mkdir -p "${public_dir}/releases/${release_dir}" "${public_dir}/screenshots"
          rsync -a --delete \
            --exclude .git \
            --exclude .github \
            --exclude .gitignore \
            --exclude releases \
            --exclude screenshots \
            "dist-commercial/${package_name}/" \
            "${public_dir}/"
          cp "dist-commercial/${package_name}.zip" "${public_dir}/releases/${release_dir}/"
          cp "dist-commercial/${package_name}.zip.sha256" "${public_dir}/releases/${release_dir}/"
          cp "dist-commercial/${package_name}.zip.sig.json" "${public_dir}/releases/${release_dir}/"
          cp dist-commercial/sbom/* "${public_dir}/releases/${release_dir}/"
          rsync -a docs/screenshots/user-manual/ "${public_dir}/screenshots/"

          if [[ ! -f public-releases/.gitignore ]]; then
            {
              echo ".DS_Store"
              echo ".env"
              echo ".env.*"
              echo "!.env.example"
              echo "*.log"
              echo "*.tmp"
              echo "node_modules/"
              echo "dist/"
              echo "build/"
              echo "*.map"
              echo "*PRIVATE_KEY*"
              echo "*private_key*"
              echo "*license*.json"
              echo "*activation*"
            } > public-releases/.gitignore
          fi

      - name: 校验公开仓库内容
        if: ${{ startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.publish_public_repo) }}
        shell: bash
        run: |
          set -euo pipefail

          public_dir="public-releases"
          release_dir="${{ steps.release.outputs.release_dir }}"
          package_name="${{ steps.release.outputs.package_name }}"

          test -f "${public_dir}/README.md"
          grep -q "SagittaDB Enterprise" "${public_dir}/README.md"
          grep -q "docker compose" "${public_dir}/README.md"
          grep -q "License" "${public_dir}/README.md"

          test -f "${public_dir}/docker-compose.yml"
          test -f "${public_dir}/.env.example"
          test -f "${public_dir}/LEGAL-NOTICE.md"
          test -f "${public_dir}/nginx.conf"
          test -d "${public_dir}/helm/sagittadb"
          test -f "${public_dir}/docs/installation.md"
          test -f "${public_dir}/docs/operations-upgrade.md"
          test -f "${public_dir}/docs/product-manual.md"
          test -f "${public_dir}/releases/${release_dir}/${package_name}.zip"
          test -f "${public_dir}/releases/${release_dir}/${package_name}.zip.sha256"
          test -f "${public_dir}/releases/${release_dir}/${package_name}.zip.sig.json"
          test -f "${public_dir}/releases/${release_dir}/sagittadb-backend-${{ steps.release.outputs.version }}.cyclonedx.json"
          test -f "${public_dir}/releases/${release_dir}/sagittadb-backend-${{ steps.release.outputs.version }}.cyclonedx.json.bundle"
          test -f "${public_dir}/releases/${release_dir}/sagittadb-frontend-${{ steps.release.outputs.version }}.cyclonedx.json"
          test -f "${public_dir}/releases/${release_dir}/sagittadb-frontend-${{ steps.release.outputs.version }}.cyclonedx.json.bundle"

          (
            cd "${public_dir}/releases/${release_dir}"
            sha256sum --check "${package_name}.zip.sha256"
            sha256sum --check "sagittadb-backend-${{ steps.release.outputs.version }}.cyclonedx.json.sha256"
            sha256sum --check "sagittadb-frontend-${{ steps.release.outputs.version }}.cyclonedx.json.sha256"
          )

          if grep -RInE \
            'LICENSE_PRIVATE_KEY|MANIFEST_PRIVATE_KEY|BEGIN [A-Z ]*PRIVATE KEY|LICENSE_SERVER_TOKEN|private_key[[:space:]]*=|docker login ghcr\.io|:latest\b|^[[:space:]]*build:' \
            "${public_dir}" \
            --exclude-dir=.git \
            --exclude='*.zip'; then
            echo "公开发布仓库包含禁止发布的内容。" >&2
            exit 1
          fi

          tmpdir="$(mktemp -d)"
          unzip -q "${public_dir}/releases/${release_dir}/${package_name}.zip" -d "${tmpdir}"
          if grep -RInE \
            'LICENSE_PRIVATE_KEY|MANIFEST_PRIVATE_KEY|BEGIN [A-Z ]*PRIVATE KEY|LICENSE_SERVER_TOKEN|private_key[[:space:]]*=|docker login ghcr\.io|:latest\b|^[[:space:]]*build:' \
            "${tmpdir}"; then
            echo "发布包包含禁止发布的内容。" >&2
            exit 1
          fi

      - name: 提交并推送 SagittaDB-Enterprise 更新
        if: ${{ startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.publish_public_repo) }}
        working-directory: public-releases
        shell: bash
        run: |
          set -euo pipefail
          if ! git rev-parse --verify HEAD >/dev/null 2>&1; then
            git switch --orphan main
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          if git diff --cached --quiet; then
            echo "SagittaDB-Enterprise 公开仓库没有需要发布的变更。"
            exit 0
          fi
          git commit -m "发布 SagittaDB Enterprise ${{ steps.release.outputs.version }}"
          git push origin HEAD:main

      - name: 创建或更新 SagittaDB-Enterprise Release
        if: ${{ startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.publish_public_repo) }}
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.PUBLIC_RELEASES_TOKEN }}
        run: |
          set -euo pipefail

          version="${{ steps.release.outputs.version }}"
          channel="${{ steps.release.outputs.channel }}"
          package_name="${{ steps.release.outputs.package_name }}"
          release_dir="${{ steps.release.outputs.release_dir }}"
          public_dir="public-releases"
          tag="v${version}"
          title="SagittaDB Enterprise v${version}"
          notes_file="$(mktemp)"

          sed \
            -e "s/X.Y.Z/${version}/g" \
            -e "s#ghcr.io/<org>/sagittadb#${PUBLIC_IMAGE_REPOSITORY}#g" \
            docs/release_templates/sagittadb_public_release.md > "${notes_file}"

          assets=(
            "${public_dir}/releases/${release_dir}/${package_name}.zip"
            "${public_dir}/releases/${release_dir}/${package_name}.zip.sha256"
            "${public_dir}/releases/${release_dir}/${package_name}.zip.sig.json"
            "${public_dir}/releases/${release_dir}/sagittadb-backend-${version}.cyclonedx.json"
            "${public_dir}/releases/${release_dir}/sagittadb-backend-${version}.cyclonedx.json.sha256"
            "${public_dir}/releases/${release_dir}/sagittadb-backend-${version}.cyclonedx.json.bundle"
            "${public_dir}/releases/${release_dir}/sagittadb-frontend-${version}.cyclonedx.json"
            "${public_dir}/releases/${release_dir}/sagittadb-frontend-${version}.cyclonedx.json.sha256"
            "${public_dir}/releases/${release_dir}/sagittadb-frontend-${version}.cyclonedx.json.bundle"
          )

          release_flags=()
          if [[ "${channel}" != "stable" ]]; then
            release_flags+=(--prerelease)
          fi

          if gh release view "${tag}" --repo "${PUBLIC_RELEASE_REPOSITORY}" >/dev/null 2>&1; then
            gh release upload "${tag}" "${assets[@]}" --repo "${PUBLIC_RELEASE_REPOSITORY}" --clobber
            gh release edit "${tag}" --repo "${PUBLIC_RELEASE_REPOSITORY}" --title "${title}" --notes-file "${notes_file}" "${release_flags[@]}"
          else
            gh release create "${tag}" "${assets[@]}" --repo "${PUBLIC_RELEASE_REPOSITORY}" --title "${title}" --notes-file "${notes_file}" "${release_flags[@]}"
          fi
