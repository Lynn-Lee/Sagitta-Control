name: 商业部署发布

on:
  push:
    branches:
      - main
      - "release/**"
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      version:
        description: "发布版本号，不带 v；留空时生成开发快照版本。"
        required: false
        type: string
      publish_public_repo:
        description: "是否将渲染后的商业部署包发布到 Public-Releases。"
        required: false
        default: true
        type: boolean

permissions:
  contents: read
  packages: write
  id-token: write

env:
  PRODUCT_CODE: sagittadb
  PRODUCT_NAME: SagittaDB Enterprise
  COMMERCIAL_BASE_VERSION: "2.0.0"
  PUBLIC_RELEASE_REPOSITORY: Lynn-Lee/Public-Releases
  PUBLIC_PRODUCT_DIR: products/sagittadb
  PUBLIC_IMAGE_REPOSITORY: ghcr.io/lynn-lee/sagittadb

jobs:
  package:
    name: 构建并发布商业部署包
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: 解析发布元数据
        id: release
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            version="${GITHUB_REF_NAME#v}"
            channel="stable"
          elif [[ -n "${{ inputs.version || '' }}" ]]; then
            version="${{ inputs.version }}"
            channel="stable"
          else
            short_sha="$(git rev-parse --short=7 HEAD)"
            version="${COMMERCIAL_BASE_VERSION}-dev.${GITHUB_RUN_NUMBER}.${short_sha}"
            channel="snapshot"
          fi
          package_name="SagittaDB-Enterprise-v${version}"
          echo "version=${version}" >> "${GITHUB_OUTPUT}"
          echo "channel=${channel}" >> "${GITHUB_OUTPUT}"
          echo "package_name=${package_name}" >> "${GITHUB_OUTPUT}"
          echo "release_dir=v${version}" >> "${GITHUB_OUTPUT}"

      - name: 登录 GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 设置 Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 校验商业构建上下文
        shell: bash
        run: scripts/validate-commercial-build-context.sh

      - name: 构建并推送商业后端镜像
        id: backend-image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: backend/Dockerfile.commercial
          push: true
          secrets: |
            manifest_private_key=${{ secrets.MANIFEST_PRIVATE_KEY }}
          build-args: |
            SAGITTADB_VERSION=${{ steps.release.outputs.version }}
          tags: |
            ${{ env.PUBLIC_IMAGE_REPOSITORY }}-backend:${{ steps.release.outputs.version }}
          labels: |
            org.opencontainers.image.title=SagittaDB Backend
            org.opencontainers.image.version=${{ steps.release.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: 构建并推送商业前端镜像
        id: frontend-image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: true
          tags: |
            ${{ env.PUBLIC_IMAGE_REPOSITORY }}-frontend:${{ steps.release.outputs.version }}
          labels: |
            org.opencontainers.image.title=SagittaDB Frontend
            org.opencontainers.image.version=${{ steps.release.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: 安装 Cosign
        uses: sigstore/cosign-installer@v3

      - name: 安装 Syft
        uses: anchore/sbom-action/download-syft@v0

      - name: 校验商业镜像内容
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${{ steps.release.outputs.version }}" \
          IMAGE_REPOSITORY="${PUBLIC_IMAGE_REPOSITORY}" \
          scripts/validate-commercial-images.sh

      - name: 生成镜像 SBOM
        shell: bash
        env:
          COSIGN_EXPERIMENTAL: "true"
        run: |
          set -euo pipefail
          VERSION="${{ steps.release.outputs.version }}" \
          IMAGE_REPOSITORY="${PUBLIC_IMAGE_REPOSITORY}" \
          SBOM_OUTPUT_DIR="dist-commercial/sbom" \
          scripts/generate-commercial-sbom.sh

      - name: 渲染客户部署包
        shell: bash
        run: |
          set -euo pipefail
          version="${{ steps.release.outputs.version }}"
          package_name="${{ steps.release.outputs.package_name }}"

          python scripts/render-customer-package.py \
            --version "${version}" \
            --image-repository "${PUBLIC_IMAGE_REPOSITORY}" \
            --output-dir dist-commercial \
            --package-name "${package_name}"

          (
            cd dist-commercial
            sha256sum --check "${package_name}.zip.sha256"
          )

      - name: 签名商业发布产物
        shell: bash
        env:
          COSIGN_EXPERIMENTAL: "true"
          MANIFEST_PRIVATE_KEY: ${{ secrets.MANIFEST_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          VERSION="${{ steps.release.outputs.version }}" \
          IMAGE_REPOSITORY="${PUBLIC_IMAGE_REPOSITORY}" \
          PACKAGE_ZIP="dist-commercial/${{ steps.release.outputs.package_name }}.zip" \
          SBOM_DIR="dist-commercial/sbom" \
          scripts/sign-commercial-artifacts.sh

      - name: 检出公开发布仓库
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.publish_public_repo }}
        uses: actions/checkout@v4
        with:
          repository: ${{ env.PUBLIC_RELEASE_REPOSITORY }}
          token: ${{ secrets.PUBLIC_RELEASES_TOKEN }}
          path: public-releases

      - name: 发布部署包到 Public-Releases
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.publish_public_repo }}
        shell: bash
        run: |
          set -euo pipefail

          package_name="${{ steps.release.outputs.package_name }}"
          release_dir="${{ steps.release.outputs.release_dir }}"
          product_dir="public-releases/${PUBLIC_PRODUCT_DIR}"

          mkdir -p "${product_dir}/releases/${release_dir}" "${product_dir}/screenshots"
          rsync -a --delete \
            --exclude releases \
            --exclude screenshots \
            "dist-commercial/${package_name}/" \
            "${product_dir}/"
          cp "dist-commercial/${package_name}.zip" "${product_dir}/releases/${release_dir}/"
          cp "dist-commercial/${package_name}.zip.sha256" "${product_dir}/releases/${release_dir}/"
          cp "dist-commercial/${package_name}.zip.sig.json" "${product_dir}/releases/${release_dir}/"
          cp dist-commercial/sbom/* "${product_dir}/releases/${release_dir}/"
          rsync -a docs/screenshots/user-manual/ "${product_dir}/screenshots/"

          if [[ ! -f public-releases/.gitignore ]]; then
            {
              echo ".DS_Store"
              echo ".env"
              echo ".env.*"
              echo "!.env.example"
              echo "*.log"
              echo "*.tmp"
              echo "node_modules/"
              echo "dist/"
              echo "build/"
              echo "*.map"
              echo "*PRIVATE_KEY*"
              echo "*private_key*"
              echo "*license*.json"
              echo "*activation*"
            } > public-releases/.gitignore
          fi

      - name: 校验公开仓库内容
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.publish_public_repo }}
        shell: bash
        run: |
          set -euo pipefail

          product_dir="public-releases/${PUBLIC_PRODUCT_DIR}"
          release_dir="${{ steps.release.outputs.release_dir }}"
          package_name="${{ steps.release.outputs.package_name }}"

          test -f public-releases/README.md
          grep -q "DataFusionX" public-releases/README.md
          grep -q "SagittaDB" public-releases/README.md
          grep -q "SchemaForge" public-releases/README.md
          grep -q "StreamForge" public-releases/README.md

          test -f "${product_dir}/README.md"
          test -f "${product_dir}/docker-compose.yml"
          test -f "${product_dir}/.env.example"
          test -f "${product_dir}/LEGAL-NOTICE.md"
          test -f "${product_dir}/nginx.conf"
          test -d "${product_dir}/helm/sagittadb"
          test -f "${product_dir}/releases/${release_dir}/${package_name}.zip"
          test -f "${product_dir}/releases/${release_dir}/${package_name}.zip.sha256"
          test -f "${product_dir}/releases/${release_dir}/${package_name}.zip.sig.json"
          test -f "${product_dir}/releases/${release_dir}/sagittadb-backend-${{ steps.release.outputs.version }}.cyclonedx.json"
          test -f "${product_dir}/releases/${release_dir}/sagittadb-frontend-${{ steps.release.outputs.version }}.cyclonedx.json"

          (
            cd "${product_dir}/releases/${release_dir}"
            sha256sum --check "${package_name}.zip.sha256"
            sha256sum --check "sagittadb-backend-${{ steps.release.outputs.version }}.cyclonedx.json.sha256"
            sha256sum --check "sagittadb-frontend-${{ steps.release.outputs.version }}.cyclonedx.json.sha256"
          )

          if grep -RInE \
            'LICENSE_PRIVATE_KEY|MANIFEST_PRIVATE_KEY|BEGIN [A-Z ]*PRIVATE KEY|LICENSE_SERVER_TOKEN|private_key[[:space:]]*=|docker login ghcr\.io|:latest\b|^[[:space:]]*build:' \
            "${product_dir}" \
            --exclude-dir=.git \
            --exclude='*.zip'; then
            echo "公开发布仓库包含禁止发布的内容。" >&2
            exit 1
          fi

          tmpdir="$(mktemp -d)"
          unzip -q "${product_dir}/releases/${release_dir}/${package_name}.zip" -d "${tmpdir}"
          if grep -RInE \
            'LICENSE_PRIVATE_KEY|MANIFEST_PRIVATE_KEY|BEGIN [A-Z ]*PRIVATE KEY|LICENSE_SERVER_TOKEN|private_key[[:space:]]*=|docker login ghcr\.io|:latest\b|^[[:space:]]*build:' \
            "${tmpdir}"; then
            echo "发布包包含禁止发布的内容。" >&2
            exit 1
          fi

      - name: 提交并推送 Public-Releases 更新
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.publish_public_repo }}
        working-directory: public-releases
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          if git diff --cached --quiet; then
            echo "Public-Releases 没有需要发布的变更。"
            exit 0
          fi
          git commit -m "发布 SagittaDB Enterprise ${{ steps.release.outputs.version }}"
          git push
