name: 用户部署发布

on:
  push:
    branches:
      - "release/**"
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      version:
        description: "发布版本号，不带 v；留空时生成开发快照版本。"
        required: false
        type: string
      publish_public_repo:
        description: "是否将渲染后的用户部署包发布到 Sagitta-Deploy 公开仓库。正式 tag 始终发布。"
        required: false
        default: false
        type: boolean
      rebuild_images:
        description: "即使当前版本用户部署镜像已存在，也强制重新构建并推送镜像。"
        required: false
        default: false
        type: boolean
      preserve_public_docs:
        description: "发布到公开部署仓库时保留现有 README、docs 和 screenshots。"
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  packages: write
  id-token: write

env:
  PRODUCT_CODE: sagitta-control
  PRODUCT_NAME: Sagitta Control
  COMMERCIAL_BASE_VERSION: "3.0.0"
  PUBLIC_RELEASE_REPOSITORY: Lynn-Lee/Sagitta-Deploy
  PUBLIC_IMAGE_REPOSITORY: ghcr.io/lynn-lee/sagitta-control

concurrency:
  group: commercial-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    name: 构建并发布用户部署包
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 解析发布元数据
        id: release
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            version="${GITHUB_REF_NAME#v}"
            channel="stable"
          elif [[ -n "${{ inputs.version || '' }}" ]]; then
            version="${{ inputs.version }}"
            channel="stable"
          elif [[ "${GITHUB_REF_NAME}" == release/* ]]; then
            short_sha="$(git rev-parse --short=7 HEAD)"
            base_version="${GITHUB_REF_NAME#release/}"
            base_version="${base_version//\//-}"
            version="${base_version}-rc.${GITHUB_RUN_NUMBER}.${short_sha}"
            channel="rc"
          else
            short_sha="$(git rev-parse --short=7 HEAD)"
            version="${COMMERCIAL_BASE_VERSION}-dev.${GITHUB_RUN_NUMBER}.${short_sha}"
            channel="snapshot"
          fi
          package_name="Sagitta-Control-v${version}"
          echo "version=${version}" >> "${GITHUB_OUTPUT}"
          echo "channel=${channel}" >> "${GITHUB_OUTPUT}"
          echo "package_name=${package_name}" >> "${GITHUB_OUTPUT}"
          echo "release_dir=v${version}" >> "${GITHUB_OUTPUT}"

      - name: 登录 GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 设置 Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver: docker-container
          driver-opts: |
            network=host
          buildkitd-config-inline: |
            [dns]
              nameservers = ["223.5.5.5", "114.114.114.114", "8.8.8.8"]

      - name: 校验用户部署构建上下文
        shell: bash
        run: scripts/validate-commercial-build-context.sh

      - name: 检查用户部署镜像是否已存在
        id: existing-images
        shell: bash
        run: |
          set -euo pipefail

          version="${{ steps.release.outputs.version }}"
          rebuild_images="${{ inputs.rebuild_images || false }}"
          backend_image="${PUBLIC_IMAGE_REPOSITORY}-backend:${version}"
          frontend_image="${PUBLIC_IMAGE_REPOSITORY}-frontend:${version}"

          if [[ "${rebuild_images}" == "true" ]]; then
            echo "已要求强制重建用户部署镜像。"
            echo "images_exist=false" >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          image_has_required_platform() {
            local image="$1"
            local manifest_file
            manifest_file="$(mktemp)"
            docker manifest inspect --verbose "${image}" >"${manifest_file}"
            python3 - "${manifest_file}" <<'PY'
          from __future__ import annotations

          import json
          import sys

          payload = json.loads(open(sys.argv[1], encoding="utf-8").read())
          expected = "linux/amd64"
          platforms: set[str] = set()

          items = payload if isinstance(payload, list) else [payload]
          for item in items:
              for manifest in item.get("manifests", []):
                  platform = manifest.get("platform") or {}
                  os_name = platform.get("os")
                  arch = platform.get("architecture")
                  variant = platform.get("variant")
                  if os_name and arch:
                      value = f"{os_name}/{arch}"
                      if variant:
                          value += f"/{variant}"
                      platforms.add(value)

              descriptor_platform = (item.get("Descriptor") or {}).get("platform") or {}
              os_name = descriptor_platform.get("os")
              arch = descriptor_platform.get("architecture")
              variant = descriptor_platform.get("variant")
              if os_name and arch:
                  value = f"{os_name}/{arch}"
                  if variant:
                      value += f"/{variant}"
                  platforms.add(value)

              os_name = item.get("os")
              arch = item.get("architecture")
              if os_name and arch:
                  platforms.add(f"{os_name}/{arch}")

          if expected not in platforms:
              print(f"missing {expected}; platforms={','.join(sorted(platforms)) or '<none>'}", file=sys.stderr)
              sys.exit(1)
          PY
          }

          if image_has_required_platform "${backend_image}" \
            && image_has_required_platform "${frontend_image}"; then
            echo "用户部署镜像已存在，跳过重复构建：${backend_image}, ${frontend_image}"
            echo "images_exist=true" >> "${GITHUB_OUTPUT}"
          else
            echo "用户部署镜像不存在、不可检查或平台不完整，将执行构建。"
            echo "images_exist=false" >> "${GITHUB_OUTPUT}"
          fi

      - name: 构建并推送用户部署后端镜像
        if: ${{ steps.existing-images.outputs.images_exist != 'true' }}
        id: backend-image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: backend/Dockerfile.commercial
          push: true
          platforms: linux/amd64
          provenance: false
          secrets: |
            manifest_private_key=${{ secrets.MANIFEST_PRIVATE_KEY }}
          build-args: |
            SAGITTA_CONTROL_VERSION=${{ steps.release.outputs.version }}
            APT_MIRROR=http://deb.debian.org/debian
            APT_SECURITY_MIRROR=http://security.debian.org/debian-security
          tags: |
            ${{ env.PUBLIC_IMAGE_REPOSITORY }}-backend:${{ steps.release.outputs.version }}
          labels: |
            org.opencontainers.image.title=Sagitta Control Backend
            org.opencontainers.image.version=${{ steps.release.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}

      - name: 构建并推送用户部署前端镜像
        if: ${{ steps.existing-images.outputs.images_exist != 'true' }}
        id: frontend-image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: true
          platforms: linux/amd64
          provenance: false
          tags: |
            ${{ env.PUBLIC_IMAGE_REPOSITORY }}-frontend:${{ steps.release.outputs.version }}
          labels: |
            org.opencontainers.image.title=Sagitta Control Frontend
            org.opencontainers.image.version=${{ steps.release.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}

      - name: 安装 Cosign
        uses: sigstore/cosign-installer@v3

      - name: 安装 Syft
        uses: anchore/sbom-action/download-syft@v0

      - name: 校验用户部署镜像内容
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${{ steps.release.outputs.version }}" \
          IMAGE_REPOSITORY="${PUBLIC_IMAGE_REPOSITORY}" \
          scripts/validate-commercial-images.sh

      - name: 生成镜像 SBOM
        shell: bash
        env:
          COSIGN_EXPERIMENTAL: "true"
        run: |
          set -euo pipefail
          VERSION="${{ steps.release.outputs.version }}" \
          IMAGE_REPOSITORY="${PUBLIC_IMAGE_REPOSITORY}" \
          SBOM_OUTPUT_DIR="dist-commercial/sbom" \
          scripts/generate-commercial-sbom.sh

      - name: 渲染用户部署包
        shell: bash
        run: |
          set -euo pipefail
          version="${{ steps.release.outputs.version }}"
          package_name="${{ steps.release.outputs.package_name }}"

          python scripts/render-customer-package.py \
            --version "${version}" \
            --image-repository "${PUBLIC_IMAGE_REPOSITORY}" \
            --output-dir dist-commercial \
            --package-name "${package_name}"

          (
            cd dist-commercial
            sha256sum --check "${package_name}.zip.sha256"
          )

      - name: 签名用户部署发布产物
        shell: bash
        env:
          COSIGN_EXPERIMENTAL: "true"
          MANIFEST_PRIVATE_KEY: ${{ secrets.MANIFEST_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          VERSION="${{ steps.release.outputs.version }}" \
          IMAGE_REPOSITORY="${PUBLIC_IMAGE_REPOSITORY}" \
          PACKAGE_ZIP="dist-commercial/${{ steps.release.outputs.package_name }}.zip" \
          SBOM_DIR="dist-commercial/sbom" \
          scripts/sign-commercial-artifacts.sh

      - name: 校验用户部署发布材料
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${{ steps.release.outputs.version }}" \
          PACKAGE_NAME="${{ steps.release.outputs.package_name }}" \
          DIST_DIR="dist-commercial" \
          SBOM_DIR="dist-commercial/sbom" \
          scripts/validate-commercial-release-materials.sh

      - name: 上传用户部署包
        if: ${{ vars.ENABLE_COMMERCIAL_RELEASE_ARTIFACT == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: sagitta-control-user-deployment
          path: |
            dist-commercial/*.zip
            dist-commercial/*.zip.sha256
            dist-commercial/*.zip.sig.json
            dist-commercial/sbom/*
          if-no-files-found: error

      - name: 检出公开发布仓库
        if: ${{ startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.publish_public_repo) }}
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.PUBLIC_RELEASES_TOKEN }}
        run: |
          set -euo pipefail
          test -n "${GH_TOKEN}" || {
            echo "缺少 PUBLIC_RELEASES_TOKEN，无法写入 ${PUBLIC_RELEASE_REPOSITORY}。" >&2
            exit 1
          }

          git init public-releases
          cd public-releases
          git remote add origin "https://github.com/${PUBLIC_RELEASE_REPOSITORY}.git"
          auth_header="$(printf 'x-access-token:%s' "${GH_TOKEN}" | base64 | tr -d '\n')"
          git config --local http.https://github.com/.extraheader "AUTHORIZATION: basic ${auth_header}"

          if git ls-remote --exit-code --heads origin main >/dev/null 2>&1; then
            git fetch --depth=1 origin main
            git checkout -B main FETCH_HEAD
          else
            git checkout -B main
          fi

      - name: 发布部署包到 Sagitta-Deploy
        if: ${{ startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.publish_public_repo) }}
        shell: bash
        run: |
          set -euo pipefail

          package_name="${{ steps.release.outputs.package_name }}"
          release_dir="${{ steps.release.outputs.release_dir }}"
          public_dir="public-releases"
          preserve_public_docs="${{ inputs.preserve_public_docs || false }}"

          mkdir -p "${public_dir}/releases/${release_dir}" "${public_dir}/screenshots"
          rsync_excludes=(
            --exclude .git \
            --exclude .github \
            --exclude .gitignore \
            --exclude releases \
            --exclude screenshots
          )
          if [[ "${preserve_public_docs}" == "true" ]]; then
            rsync_excludes+=(
              --exclude README.md
              --exclude docs
              --exclude screenshots
            )
          fi

          rsync -a --delete \
            "${rsync_excludes[@]}" \
            "dist-commercial/${package_name}/" \
            "${public_dir}/"
          cp "dist-commercial/${package_name}.zip" "${public_dir}/releases/${release_dir}/"
          cp "dist-commercial/${package_name}.zip.sha256" "${public_dir}/releases/${release_dir}/"
          cp "dist-commercial/${package_name}.zip.sig.json" "${public_dir}/releases/${release_dir}/"
          cp "dist-commercial/sbom/sagitta-control-backend-${{ steps.release.outputs.version }}.cyclonedx.json" "${public_dir}/releases/${release_dir}/"
          cp "dist-commercial/sbom/sagitta-control-backend-${{ steps.release.outputs.version }}.cyclonedx.json.sha256" "${public_dir}/releases/${release_dir}/"
          cp "dist-commercial/sbom/sagitta-control-backend-${{ steps.release.outputs.version }}.cyclonedx.json.bundle" "${public_dir}/releases/${release_dir}/"
          cp "dist-commercial/sbom/sagitta-control-frontend-${{ steps.release.outputs.version }}.cyclonedx.json" "${public_dir}/releases/${release_dir}/"
          cp "dist-commercial/sbom/sagitta-control-frontend-${{ steps.release.outputs.version }}.cyclonedx.json.sha256" "${public_dir}/releases/${release_dir}/"
          cp "dist-commercial/sbom/sagitta-control-frontend-${{ steps.release.outputs.version }}.cyclonedx.json.bundle" "${public_dir}/releases/${release_dir}/"
          if [[ "${preserve_public_docs}" != "true" ]]; then
            rsync -a --delete docs/screenshots/user-manual/ "${public_dir}/screenshots/"
          fi

          if [[ ! -f public-releases/.gitignore ]]; then
            {
              echo ".DS_Store"
              echo ".env"
              echo ".env.*"
              echo "!.env.example"
              echo "*.log"
              echo "*.tmp"
              echo "node_modules/"
              echo "dist/"
              echo "build/"
              echo "*.map"
              echo "*PRIVATE_KEY*"
              echo "*private_key*"
              echo "*license*.json"
              echo "*activation*"
            } > public-releases/.gitignore
          fi

      - name: 校验公开仓库内容
        if: ${{ startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.publish_public_repo) }}
        shell: bash
        run: |
          set -euo pipefail

          public_dir="public-releases"
          release_dir="${{ steps.release.outputs.release_dir }}"
          package_name="${{ steps.release.outputs.package_name }}"

          test -f "${public_dir}/README.md"
          grep -q "Sagitta Control" "${public_dir}/README.md"
          grep -q "docker compose" "${public_dir}/README.md"
          grep -q "screenshots/23-commercial-support.png" "${public_dir}/README.md"

          test -f "${public_dir}/docker-compose.yml"
          test -f "${public_dir}/.env.example"
          test -f "${public_dir}/nginx.conf"
          test -d "${public_dir}/helm/sagitta-control"
          test -f "${public_dir}/docs/installation_deployment.md"
          test -f "${public_dir}/docs/operations_upgrade.md"
          test -f "${public_dir}/docs/user_manual.md"
          grep -q "../screenshots/23-commercial-support.png" "${public_dir}/docs/operations_upgrade.md"
          grep -q "../screenshots/02-dashboard-query.png" "${public_dir}/docs/user_manual.md"
          grep -q "../screenshots/06-workflow-list.png" "${public_dir}/docs/user_manual.md"
          grep -q "../screenshots/09-query-workbench.png" "${public_dir}/docs/user_manual.md"
          grep -q "../screenshots/12-monitor.png" "${public_dir}/docs/user_manual.md"
          grep -q "../screenshots/21-system-config.png" "${public_dir}/docs/user_manual.md"
          test -f "${public_dir}/screenshots/02-dashboard-query.png"
          test -f "${public_dir}/screenshots/09-query-workbench.png"
          test -f "${public_dir}/screenshots/23-commercial-support.png"
          test -f "${public_dir}/screenshots/24-audit-log.png"
          test ! -f "${public_dir}/screenshots/20-license.png"
          ! grep -R "20-license.png" "${public_dir}/README.md" "${public_dir}/docs"
          test -f "${public_dir}/releases/${release_dir}/${package_name}.zip"
          test -f "${public_dir}/releases/${release_dir}/${package_name}.zip.sha256"
          test -f "${public_dir}/releases/${release_dir}/${package_name}.zip.sig.json"
          test -f "${public_dir}/releases/${release_dir}/sagitta-control-backend-${{ steps.release.outputs.version }}.cyclonedx.json"
          test -f "${public_dir}/releases/${release_dir}/sagitta-control-backend-${{ steps.release.outputs.version }}.cyclonedx.json.bundle"
          test -f "${public_dir}/releases/${release_dir}/sagitta-control-frontend-${{ steps.release.outputs.version }}.cyclonedx.json"
          test -f "${public_dir}/releases/${release_dir}/sagitta-control-frontend-${{ steps.release.outputs.version }}.cyclonedx.json.bundle"

          (
            cd "${public_dir}/releases/${release_dir}"
            sha256sum --check "${package_name}.zip.sha256"
            sha256sum --check "sagitta-control-backend-${{ steps.release.outputs.version }}.cyclonedx.json.sha256"
            sha256sum --check "sagitta-control-frontend-${{ steps.release.outputs.version }}.cyclonedx.json.sha256"
          )

          if grep -RInE \
            'LICENSE_PRIVATE_KEY|MANIFEST_PRIVATE_KEY|BEGIN [A-Z ]*PRIVATE KEY|LICENSE_SERVER_TOKEN|private_key[[:space:]]*=|docker login ghcr\.io|:latest\b|^[[:space:]]*build:' \
            "${public_dir}" \
            --exclude-dir=.git \
            --exclude='*.zip'; then
            echo "公开发布仓库包含禁止发布的内容。" >&2
            exit 1
          fi

          tmpdir="$(mktemp -d)"
          unzip -q "${public_dir}/releases/${release_dir}/${package_name}.zip" -d "${tmpdir}"
          if grep -RInE \
            'LICENSE_PRIVATE_KEY|MANIFEST_PRIVATE_KEY|BEGIN [A-Z ]*PRIVATE KEY|LICENSE_SERVER_TOKEN|private_key[[:space:]]*=|docker login ghcr\.io|:latest\b|^[[:space:]]*build:' \
            "${tmpdir}"; then
            echo "发布包包含禁止发布的内容。" >&2
            exit 1
          fi

      - name: 提交并推送 Sagitta-Deploy 更新
        if: ${{ startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.publish_public_repo) }}
        working-directory: public-releases
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.PUBLIC_RELEASES_TOKEN }}
        run: |
          set -euo pipefail
          test -n "${GH_TOKEN}" || {
            echo "缺少 PUBLIC_RELEASES_TOKEN，无法写入 ${PUBLIC_RELEASE_REPOSITORY}。" >&2
            exit 1
          }
          auth_header="$(printf 'x-access-token:%s' "${GH_TOKEN}" | base64 | tr -d '\n')"
          git config --local http.https://github.com/.extraheader "AUTHORIZATION: basic ${auth_header}"

          if ! git rev-parse --verify HEAD >/dev/null 2>&1; then
            git switch --orphan main
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          if git diff --cached --quiet; then
            echo "Sagitta-Deploy 公开仓库没有需要发布的变更。"
            exit 0
          fi
          git commit -m "发布 Sagitta Control ${{ steps.release.outputs.version }}"
          git push origin HEAD:main

      - name: 创建或更新 Sagitta-Deploy Release
        if: ${{ startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.publish_public_repo) }}
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.PUBLIC_RELEASES_TOKEN }}
        run: |
          set -euo pipefail

          version="${{ steps.release.outputs.version }}"
          channel="${{ steps.release.outputs.channel }}"
          package_name="${{ steps.release.outputs.package_name }}"
          release_dir="${{ steps.release.outputs.release_dir }}"
          public_dir="public-releases"
          tag="v${version}"
          title="Sagitta Control v${version}"
          notes_file="$(mktemp)"

          cat > "${notes_file}" <<EOF
          # Sagitta Control v${version}

          ## 镜像

          - \`${PUBLIC_IMAGE_REPOSITORY}-backend:${version}\`
          - \`${PUBLIC_IMAGE_REPOSITORY}-frontend:${version}\`

          ## 安装

          下载 \`Sagitta-Control-v${version}.zip\` 和 sha256 文件，校验后解压，并按包内 \`README.md\` 和 \`docs/installation_deployment.md\` 部署。

          \`\`\`bash
          wget https://github.com/Lynn-Lee/Sagitta-Deploy/releases/download/v${version}/Sagitta-Control-v${version}.zip
          wget https://github.com/Lynn-Lee/Sagitta-Deploy/releases/download/v${version}/Sagitta-Control-v${version}.zip.sha256
          sha256sum -c Sagitta-Control-v${version}.zip.sha256
          unzip Sagitta-Control-v${version}.zip
          cd Sagitta-Control-v${version}
          cp .env.example .env
          ./prepare-go-live-env.sh --customer-id <customer_id>
          docker compose pull
          docker compose up -d postgres redis
          docker compose run --rm backend alembic upgrade head
          docker compose up -d
          docker compose ps
          \`\`\`

          启动后先检查：

          \`\`\`bash
          curl -fsS http://127.0.0.1:8000/health
          curl -fsS http://127.0.0.1/health
          \`\`\`

          ## 试用与授权

          首次部署自动进入 60 天全功能试用期。试用到期后，业务 API 会被阻断，授权管理页仍可访问。

          在线授权默认需要至少每 7 天成功联网刷新一次；长期离线部署请使用 challenge-response 离线授权。

          ## 安全说明

          本部署包只包含部署文件，不包含 Sagitta Control 源码、私钥、客户 License、激活码或镜像仓库凭据。Release 同时提供用户部署包签名文件、前后端镜像 CycloneDX SBOM 及其校验/签名材料。
          EOF

          assets=(
            "${public_dir}/releases/${release_dir}/${package_name}.zip"
            "${public_dir}/releases/${release_dir}/${package_name}.zip.sha256"
            "${public_dir}/releases/${release_dir}/${package_name}.zip.sig.json"
            "${public_dir}/releases/${release_dir}/sagitta-control-backend-${version}.cyclonedx.json"
            "${public_dir}/releases/${release_dir}/sagitta-control-backend-${version}.cyclonedx.json.sha256"
            "${public_dir}/releases/${release_dir}/sagitta-control-backend-${version}.cyclonedx.json.bundle"
            "${public_dir}/releases/${release_dir}/sagitta-control-frontend-${version}.cyclonedx.json"
            "${public_dir}/releases/${release_dir}/sagitta-control-frontend-${version}.cyclonedx.json.sha256"
            "${public_dir}/releases/${release_dir}/sagitta-control-frontend-${version}.cyclonedx.json.bundle"
          )

          release_flags=()
          if [[ "${channel}" != "stable" ]]; then
            release_flags+=(--prerelease)
          fi

          if gh release view "${tag}" --repo "${PUBLIC_RELEASE_REPOSITORY}" >/dev/null 2>&1; then
            gh release upload "${tag}" "${assets[@]}" --repo "${PUBLIC_RELEASE_REPOSITORY}" --clobber
            gh release edit "${tag}" --repo "${PUBLIC_RELEASE_REPOSITORY}" --title "${title}" --notes-file "${notes_file}" "${release_flags[@]}"
          else
            gh release create "${tag}" "${assets[@]}" --repo "${PUBLIC_RELEASE_REPOSITORY}" --title "${title}" --notes-file "${notes_file}" "${release_flags[@]}"
          fi
