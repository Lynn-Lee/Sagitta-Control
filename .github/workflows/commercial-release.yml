name: Commercial Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      version:
        description: "Release version without leading v, for example 1.0.4"
        required: true
        type: string

permissions:
  contents: read
  packages: write

jobs:
  package:
    name: Build Customer Deployment Package
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Resolve release metadata
        id: release
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            version="${GITHUB_REF_NAME#v}"
          else
            version="${{ inputs.version }}"
          fi
          repo_lc="$(printf '%s' "${GITHUB_REPOSITORY}" | tr '[:upper:]' '[:lower:]')"
          minor_tag="$(printf '%s' "${version}" | awk -F. '{print $1 "." $2}')"
          package_name="SagittaDB-Enterprise-v${version}"
          echo "version=${version}" >> "${GITHUB_OUTPUT}"
          echo "minor_tag=${minor_tag}" >> "${GITHUB_OUTPUT}"
          echo "repo_lc=${repo_lc}" >> "${GITHUB_OUTPUT}"
          echo "package_name=${package_name}" >> "${GITHUB_OUTPUT}"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push commercial backend image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          tags: |
            ghcr.io/${{ steps.release.outputs.repo_lc }}-backend:${{ steps.release.outputs.version }}
            ghcr.io/${{ steps.release.outputs.repo_lc }}-backend:${{ steps.release.outputs.minor_tag }}
          labels: |
            org.opencontainers.image.title=SagittaDB Backend
            org.opencontainers.image.version=${{ steps.release.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push commercial frontend image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: true
          tags: |
            ghcr.io/${{ steps.release.outputs.repo_lc }}-frontend:${{ steps.release.outputs.version }}
            ghcr.io/${{ steps.release.outputs.repo_lc }}-frontend:${{ steps.release.outputs.minor_tag }}
          labels: |
            org.opencontainers.image.title=SagittaDB Frontend
            org.opencontainers.image.version=${{ steps.release.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Render customer deployment package
        shell: bash
        run: |
          set -euo pipefail
          version="${{ steps.release.outputs.version }}"
          repo_lc="${{ steps.release.outputs.repo_lc }}"
          package_name="${{ steps.release.outputs.package_name }}"
          out_dir="dist-commercial/${package_name}"

          mkdir -p "${out_dir}"
          cp deploy/customer/docker-compose.yml "${out_dir}/docker-compose.yml"
          cp deploy/customer/.env.example "${out_dir}/.env.example"
          cp deploy/customer/README.md "${out_dir}/README.md"
          cp deploy/customer/upgrade.sh "${out_dir}/upgrade.sh"
          cp deploy/nginx.conf "${out_dir}/nginx.conf"
          chmod +x "${out_dir}/upgrade.sh"

          sed -i "s#__SAGITTADB_VERSION__#${version}#g" "${out_dir}/docker-compose.yml" "${out_dir}/README.md" "${out_dir}/upgrade.sh"
          sed -i "s#__IMAGE_REPOSITORY__#ghcr.io/${repo_lc}#g" "${out_dir}/docker-compose.yml" "${out_dir}/README.md" "${out_dir}/upgrade.sh"

          (
            cd dist-commercial
            zip -r "${package_name}.zip" "${package_name}"
            sha256sum "${package_name}.zip" > "${package_name}.zip.sha256"
          )

      - name: Upload customer deployment package
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.release.outputs.package_name }}
          path: |
            dist-commercial/${{ steps.release.outputs.package_name }}.zip
            dist-commercial/${{ steps.release.outputs.package_name }}.zip.sha256
