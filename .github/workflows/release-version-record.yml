name: Release Version Record

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  record:
    name: 记录版本
    runs-on: [self-hosted, Linux, ARM64, sagitta-control]
    steps:
      - name: 检出代码
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          archive="$(mktemp)"
          for attempt in 1 2 3 4; do
            rm -f "${archive}"
            if curl --http1.1 -fsSL --retry 5 --retry-all-errors --retry-delay 5 --connect-timeout 20 --max-time 900 \
              -H "Authorization: Bearer ${GITHUB_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/tarball/${GITHUB_SHA}" \
              -o "${archive}"; then
              break
            fi
            if [ "${attempt}" = "4" ]; then
              exit 1
            fi
            sleep $((attempt * 10))
          done
          find "${GITHUB_WORKSPACE}" -mindepth 1 -maxdepth 1 -exec rm -rf {} +
          tar -xzf "${archive}" --strip-components=1 -C "${GITHUB_WORKSPACE}"
          rm -f "${archive}"

      - name: 生成版本元数据
        id: version
        shell: bash
        run: |
          SHORT_SHA="${GITHUB_SHA::7}"
          VERSION="v2.3.0-${GITHUB_RUN_NUMBER}-${SHORT_SHA}"
          mkdir -p release-record
          cat > release-record/release-version.json <<JSON
          {
            "version": "${VERSION}",
            "commit": "${GITHUB_SHA}",
            "branch": "${GITHUB_REF_NAME}",
            "runNumber": ${GITHUB_RUN_NUMBER},
            "runId": ${GITHUB_RUN_ID},
            "repository": "${GITHUB_REPOSITORY}"
          }
          JSON
          {
            echo "version=${VERSION}"
            echo "short_sha=${SHORT_SHA}"
          } >> "$GITHUB_OUTPUT"

      - name: 写入任务摘要
        run: |
          {
            echo "## Sagitta Control 发布版本记录"
            echo ""
            echo "- 版本：\`${{ steps.version.outputs.version }}\`"
            echo "- 提交：\`${{ github.sha }}\`"
            echo "- 分支：\`${{ github.ref_name }}\`"
            echo "- CI 运行编号：\`${{ github.run_id }}\`"
            echo ""
            echo "默认不上传制品，避免占用 GitHub Actions 存储配额。"
          } >> "$GITHUB_STEP_SUMMARY"
          cat release-record/release-version.json

      - name: 上传发布版本记录
        if: ${{ vars.ENABLE_RELEASE_VERSION_ARTIFACT == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: release-version-${{ steps.version.outputs.short_sha }}
          path: release-record/release-version.json
          retention-days: 7
