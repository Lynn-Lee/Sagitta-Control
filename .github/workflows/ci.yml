name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  frontend:
    name: 前端质量门禁
    runs-on: [self-hosted, Linux, X64, sagitta-control]
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 校验 Node.js
        run: |
          node --version
          npm --version

      - name: 安装依赖
        run: npm ci

      - name: 前端依赖安全审计
        run: npm audit --audit-level=high

      - name: Lint
        run: npm run lint

      - name: 单元测试
        run: npm run test

      - name: 构建与体积预算
        run: npm run build:check

      - name: 安装 Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: 前端冒烟 E2E
        shell: bash
        run: |
          set -euo pipefail
          npm run preview -- --host 127.0.0.1 --port 4173 > /tmp/sagitta-control-vite-preview.log 2>&1 &
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:4173 >/dev/null; then
              break
            fi
            if [[ "$i" == "30" ]]; then
              cat /tmp/sagitta-control-vite-preview.log
              exit 1
            fi
            sleep 1
          done
          E2E_BASE_URL=http://127.0.0.1:4173 npm run e2e:smoke

  backend:
    name: 后端质量门禁
    runs-on: [self-hosted, Linux, X64, sagitta-control]
    env:
      APP_ENV: development
      SECRET_KEY: ci_test_secret_key_please_do_not_use_in_production
      DATABASE_URL: postgresql+asyncpg://sagitta:sagitta123@127.0.0.1:55432/sagitta_control_test
      DATABASE_URL_SYNC: postgresql+psycopg2://sagitta:sagitta123@127.0.0.1:55432/sagitta_control_test
      REDIS_URL: redis://127.0.0.1:56379/0
      CI_POSTGRES_CONTAINER: sagitta-ci-postgres-${{ github.run_id }}-${{ github.run_attempt }}
      CI_REDIS_CONTAINER: sagitta-ci-redis-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 准备 Python 虚拟环境
        shell: bash
        run: |
          rm -rf .venv-ci
          uv venv --python python3 .venv-ci
          echo "VIRTUAL_ENV=${PWD}/.venv-ci" >> "${GITHUB_ENV}"
          echo "${PWD}/.venv-ci/bin" >> "${GITHUB_PATH}"

      - name: 校验 Python 与 uv
        run: |
          python3 --version
          uv --version

      - name: 启动后端测试依赖
        shell: bash
        run: |
          set -euo pipefail
          docker image inspect postgres:16-alpine >/dev/null
          docker image inspect redis:7-alpine >/dev/null
          docker rm -f "${CI_POSTGRES_CONTAINER}" "${CI_REDIS_CONTAINER}" >/dev/null 2>&1 || true
          docker run -d \
            --name "${CI_POSTGRES_CONTAINER}" \
            --pull=never \
            -e POSTGRES_DB=sagitta_control_test \
            -e POSTGRES_USER=sagitta \
            -e POSTGRES_PASSWORD=sagitta123 \
            -p 127.0.0.1:55432:5432 \
            postgres:16-alpine
          docker run -d \
            --name "${CI_REDIS_CONTAINER}" \
            --pull=never \
            -p 127.0.0.1:56379:6379 \
            redis:7-alpine
          for i in {1..30}; do
            if docker exec "${CI_POSTGRES_CONTAINER}" pg_isready -U sagitta -d sagitta_control_test \
              && docker exec "${CI_REDIS_CONTAINER}" redis-cli ping >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          docker logs "${CI_POSTGRES_CONTAINER}" || true
          docker logs "${CI_REDIS_CONTAINER}" || true
          exit 1

      - name: 校验后端依赖锁
        shell: bash
        run: |
          python3 - <<'PY'
          from __future__ import annotations

          import re
          import sys
          import tomllib
          from pathlib import Path

          def normalize_name(value: str) -> str:
              return re.sub(r"[-_.]+", "-", value).lower()

          def requirement_name(value: str) -> str:
              match = re.match(r"\s*([A-Za-z0-9_.-]+)", value)
              if not match:
                  raise ValueError(f"无法解析依赖声明：{value!r}")
              return normalize_name(match.group(1))

          pyproject = tomllib.loads(Path("backend/pyproject.toml").read_text(encoding="utf-8"))
          expected = {
              requirement_name(item)
              for item in pyproject["project"].get("dependencies", [])
          }
          expected.update(
              requirement_name(item)
              for item in pyproject["project"].get("optional-dependencies", {}).get("dev", [])
          )

          locked: set[str] = set()
          for line in Path("backend/requirements.lock").read_text(encoding="utf-8").splitlines():
              line = line.strip()
              if not line or line.startswith("#") or line.startswith("-"):
                  continue
              locked.add(requirement_name(line))

          missing = sorted(expected - locked)
          if missing:
              print("backend/requirements.lock 缺少直接依赖：", ", ".join(missing), file=sys.stderr)
              sys.exit(1)
          print(f"backend/requirements.lock 覆盖 {len(expected)} 个后端直接依赖")
          PY

      - name: 安装后端依赖
        shell: bash
        run: |
          uv pip install -r backend/requirements.lock
          uv pip install --no-deps -e backend

      - name: 后端依赖安全审计
        run: uvx pip-audit --disable-pip --no-deps -r backend/requirements.lock

      - name: 后端 Lint
        working-directory: backend
        run: ruff check app tests/unit --ignore I001,UP017

      - name: 后端类型检查（已清洁基线）
        working-directory: backend
        shell: bash
        run: |
          while IFS= read -r target; do
            mypy --follow-imports=silent "$target"
          done < mypy-baseline.txt

      - name: 后端全量类型审计（存量债追踪）
        working-directory: backend
        shell: bash
        run: |
          set +e
          mypy app
          status=$?
          if [[ "$status" -ne 0 ]]; then
            echo "::notice title=后端全量类型审计::仍存在存量类型问题，当前只将 mypy-baseline.txt 中的已清洁文件作为硬门禁。"
          fi
          exit 0

      - name: 后端单元测试
        working-directory: backend
        run: pytest tests/unit/ -v --cov=app --cov-fail-under=55

      - name: 引擎矩阵契约校验
        run: python3 scripts/validate-engine-matrix-contract.py

      - name: 验收脚本单元测试
        run: python3 -m pytest tests/scripts -q

      - name: 准备 Compose 环境变量
        run: cp .env.example .env

      - name: 校验 Docker Compose
        run: docker compose -f deploy/docker-compose.yml config --quiet

      - name: 构建后端镜像
        run: docker build -f backend/Dockerfile -t sagitta-control-backend-ci:${GITHUB_SHA} backend

      - name: 清理后端测试依赖
        if: always()
        run: docker rm -f "${CI_POSTGRES_CONTAINER}" "${CI_REDIS_CONTAINER}" >/dev/null 2>&1 || true
