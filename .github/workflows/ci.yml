name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  frontend:
    name: 前端质量门禁
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: 检出代码
        uses: actions/checkout@v5

      - name: 设置 Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: 校验 Node.js
        run: |
          node --version
          npm --version

      - name: 安装依赖
        run: npm ci

      - name: 前端依赖安全审计
        run: npm audit --audit-level=high

      - name: Lint
        run: npm run lint

      - name: 单元测试
        run: npm run test

      - name: 构建与体积预算
        run: npm run build:check

      - name: 安装 Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: 前端冒烟 E2E
        shell: bash
        run: |
          set -euo pipefail
          npm run preview -- --host 127.0.0.1 --port 4173 > /tmp/sagitta-control-vite-preview.log 2>&1 &
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:4173 >/dev/null; then
              break
            fi
            if [[ "$i" == "30" ]]; then
              cat /tmp/sagitta-control-vite-preview.log
              exit 1
            fi
            sleep 1
          done
          E2E_BASE_URL=http://127.0.0.1:4173 npm run e2e:smoke

  backend:
    name: 后端质量门禁
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: sagitta_control_test
          POSTGRES_USER: sagitta
          POSTGRES_PASSWORD: sagitta123
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sagitta -d sagitta_control_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5
    env:
      APP_ENV: development
      SECRET_KEY: ci_test_secret_key_please_do_not_use_in_production
      DATABASE_URL: postgresql+asyncpg://sagitta:sagitta123@127.0.0.1:5432/sagitta_control_test
      DATABASE_URL_SYNC: postgresql+psycopg2://sagitta:sagitta123@127.0.0.1:5432/sagitta_control_test
      REDIS_URL: redis://127.0.0.1:6379/0
    steps:
      - name: 检出代码
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: 设置 Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: 设置 uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          # 本仓库锁文件为 requirements.lock，默认 glob（**/requirements*.txt）无法命中，需显式指定
          cache-dependency-glob: "backend/requirements.lock"

      - name: 校验 Python 与 uv
        run: |
          python3 --version
          uv --version

      - name: 校验后端依赖锁
        shell: bash
        run: |
          lock_cutoff="$(git log -1 --format=%cI -- backend/requirements.lock)"
          uv pip compile \
            --python-version 3.12 \
            --universal \
            --extra dev \
            --exclude-newer "${lock_cutoff}" \
            --custom-compile-command 'uv pip compile --python-version 3.12 --universal --extra dev --output-file backend/requirements.lock backend/pyproject.toml' \
            --output-file /tmp/sagitta-control-backend-requirements.lock \
            backend/pyproject.toml
          diff -u backend/requirements.lock /tmp/sagitta-control-backend-requirements.lock

      - name: 安装后端依赖
        shell: bash
        run: |
          uv pip install --system --break-system-packages -r backend/requirements.lock
          uv pip install --system --break-system-packages --no-deps -e backend

      - name: 后端依赖安全审计
        run: uvx pip-audit --disable-pip --no-deps -r backend/requirements.lock

      - name: 后端 Lint
        working-directory: backend
        run: ruff check app tests/unit --ignore I001,UP017

      - name: 后端全量类型检查（strict 硬门禁）
        working-directory: backend
        run: mypy app

      - name: 后端单元测试
        working-directory: backend
        run: pytest tests/unit/ -v --cov=app --cov-fail-under=55

      - name: 引擎矩阵契约校验
        run: python3 scripts/validate-engine-matrix-contract.py

      - name: 验收脚本单元测试
        run: python3 -m pytest tests/scripts -q

      - name: 准备 Compose 环境变量
        run: cp .env.example .env

      - name: 校验 Docker Compose
        run: docker compose -f deploy/docker-compose.yml config --quiet

      - name: 设置 Docker Buildx
        uses: docker/setup-buildx-action@v4
        with:
          driver: docker-container
          driver-opts: |
            network=host
          buildkitd-config-inline: |
            [dns]
              nameservers = ["223.5.5.5", "114.114.114.114", "8.8.8.8"]

      - name: 构建后端镜像
        uses: docker/build-push-action@v7
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: false
          provenance: false
