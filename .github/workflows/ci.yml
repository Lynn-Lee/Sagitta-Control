name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  frontend:
    name: 前端质量门禁
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: 安装依赖
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: 单元测试
        run: npm run test

      - name: 构建与体积预算
        run: npm run build:check

      - name: 安装 Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: 前端冒烟 E2E
        shell: bash
        run: |
          set -euo pipefail
          npm run preview -- --host 127.0.0.1 --port 4173 > /tmp/sagittadb-vite-preview.log 2>&1 &
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:4173 >/dev/null; then
              break
            fi
            if [[ "$i" == "30" ]]; then
              cat /tmp/sagittadb-vite-preview.log
              exit 1
            fi
            sleep 1
          done
          E2E_BASE_URL=http://127.0.0.1:4173 npm run e2e:smoke

  backend:
    name: 后端质量门禁
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: sagittadb_test
          POSTGRES_USER: sagitta
          POSTGRES_PASSWORD: sagitta123
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sagitta -d sagittadb_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5
    env:
      APP_ENV: development
      SECRET_KEY: ci_test_secret_key_please_do_not_use_in_production
      DATABASE_URL: postgresql+asyncpg://sagitta:sagitta123@127.0.0.1:5432/sagittadb_test
      DATABASE_URL_SYNC: postgresql+psycopg2://sagitta:sagitta123@127.0.0.1:5432/sagittadb_test
      REDIS_URL: redis://127.0.0.1:6379/0
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: 安装后端依赖
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: 后端 Lint
        working-directory: backend
        run: ruff check app tests/unit --ignore I001,UP017

      - name: 后端类型检查（存量基线，暂不阻断）
        continue-on-error: true
        working-directory: backend
        run: mypy app

      - name: 后端单元测试
        working-directory: backend
        run: pytest tests/unit/ -v --cov=app --cov-fail-under=35

      - name: 引擎矩阵契约校验
        run: python scripts/validate-engine-matrix-contract.py

      - name: 准备 Compose 环境变量
        run: cp .env.example .env

      - name: 校验 Docker Compose
        run: docker compose -f deploy/docker-compose.yml config --quiet

      - name: 构建后端镜像
        run: docker compose -f deploy/docker-compose.yml build backend
