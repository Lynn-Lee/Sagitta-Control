{{- if and (eq .Values.app.env "production") (or (contains "CHANGE_ME" .Values.app.secretKey) (contains "CHANGE_ME" .Values.app.fernetKey)) }}
{{- fail "app.secretKey / app.fernetKey 仍为占位默认值，生产部署前必须替换为随机值。生成：SECRET_KEY=`python -c \"import secrets;print(secrets.token_hex(32))\"`，FERNET_KEY=`python -c \"from cryptography.fernet import Fernet;print(Fernet.generate_key().decode())\"`" }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "sagitta-control.fullname" . }}
  labels:
    {{- include "sagitta-control.labels" . | nindent 4 }}
type: Opaque
stringData:
  SECRET_KEY: {{ .Values.app.secretKey | quote }}
  FERNET_KEY: {{ .Values.app.fernetKey | quote }}
  {{- if .Values.postgresql.enabled }}
  DATABASE_URL: {{ printf "postgresql+asyncpg://%s:%s@%s:5432/%s" .Values.postgresql.auth.username .Values.postgresql.auth.password (include "sagitta-control.postgresHost" .) .Values.postgresql.auth.database | quote }}
  DATABASE_URL_SYNC: {{ printf "postgresql+psycopg2://%s:%s@%s:5432/%s" .Values.postgresql.auth.username .Values.postgresql.auth.password (include "sagitta-control.postgresHost" .) .Values.postgresql.auth.database | quote }}
  {{- else }}
  DATABASE_URL: {{ printf "postgresql+asyncpg://%s:%s@%s:%d/%s" .Values.externalDatabase.username .Values.externalDatabase.password .Values.externalDatabase.host (.Values.externalDatabase.port | int) .Values.externalDatabase.database | quote }}
  DATABASE_URL_SYNC: {{ printf "postgresql+psycopg2://%s:%s@%s:%d/%s" .Values.externalDatabase.username .Values.externalDatabase.password .Values.externalDatabase.host (.Values.externalDatabase.port | int) .Values.externalDatabase.database | quote }}
  {{- end }}
  {{- if .Values.redis.enabled }}
  REDIS_URL: {{ printf "redis://:%s@%s:6379/0" .Values.redis.auth.password (include "sagitta-control.redisHost" .) | quote }}
  REDIS_PASSWORD: {{ .Values.redis.auth.password | quote }}
  {{- else }}
  REDIS_URL: {{ printf "redis://:%s@%s:%d/%d" .Values.externalRedis.password .Values.externalRedis.host (.Values.externalRedis.port | int) (.Values.externalRedis.db | int) | quote }}
  REDIS_PASSWORD: {{ .Values.externalRedis.password | quote }}
  {{- end }}
  AI_API_KEY: {{ .Values.app.aiApiKey | quote }}
  LICENSE_PUBLIC_KEY: {{ .Values.license.publicKey | quote }}
  LICENSE_CUSTOMER_ID: {{ .Values.license.customerId | quote }}
  LICENSE_DEPLOYMENT_ID: {{ .Values.license.deploymentId | quote }}
  MANIFEST_PUBLIC_KEY: {{ default .Values.license.publicKey .Values.integrity.manifestPublicKey | quote }}
